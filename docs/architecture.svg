<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">
  <title>SellerShield architecture</title>
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5b6472"/></marker>
  </defs>
  <g fill="none" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)">
    <path d="M190 120 H262"/><path d="M190 300 H262"/>
    <path d="M520 110 H600"/><path d="M520 200 H600"/><path d="M520 290 H600"/><path d="M520 380 H600"/>
    
    <path d="M600 440 H526"/>
  </g>
  <g>
    <rect x="20" y="70" width="170" height="100" rx="12" fill="#e8effc" stroke="#0b57d0"/>
    <text x="105" y="102" text-anchor="middle" font-weight="700">Seller dashboard</text>
    <text x="105" y="122" text-anchor="middle">AG Grid · AG Charts</text>
    <text x="105" y="140" text-anchor="middle">Bryntum timeline</text>
    <text x="105" y="158" text-anchor="middle">live feed (SSE)</text>
    <rect x="20" y="250" width="170" height="100" rx="12" fill="#e8effc" stroke="#0b57d0"/>
    <text x="105" y="282" text-anchor="middle" font-weight="700">Demo store</text>
    <text x="105" y="302" text-anchor="middle">PayPal JS SDK</text>
    <text x="105" y="320" text-anchor="middle">Buttons (Checkout)</text>
  </g>
  <g>
    <rect x="262" y="40" width="258" height="405" rx="14" fill="#f5f6f8" stroke="#111827"/>
    <text x="391" y="66" text-anchor="middle" font-weight="700" font-size="15">SellerShield server (Node, Render)</text>
    <rect x="280" y="82" width="222" height="58" rx="9" fill="#fff" stroke="#9aa3b2"/>
    <text x="391" y="106" text-anchor="middle" font-weight="600">Agent loop</text>
    <text x="391" y="124" text-anchor="middle">scan · propose · autopilot</text>
    <rect x="280" y="150" width="222" height="58" rx="9" fill="#e6f4ea" stroke="#137333"/>
    <text x="391" y="174" text-anchor="middle" font-weight="600">Seller Protection check</text>
    <text x="391" y="192" text-anchor="middle">deterministic, PayPal's rules</text>
    <rect x="280" y="218" width="222" height="58" rx="9" fill="#e6f4ea" stroke="#137333"/>
    <text x="391" y="242" text-anchor="middle" font-weight="600">Guardrails</text>
    <text x="391" y="260" text-anchor="middle">citation check · SHA-256 approvals</text>
    <rect x="280" y="286" width="222" height="58" rx="9" fill="#fff3e0" stroke="#a35200"/>
    <text x="391" y="310" text-anchor="middle" font-weight="600">Claude (tool use)</text>
    <text x="391" y="328" text-anchor="middle">decide · draft · chat agent</text>
    <rect x="280" y="354" width="222" height="76" rx="9" fill="#fff" stroke="#9aa3b2"/>
    <text x="391" y="378" text-anchor="middle" font-weight="600">Per-visitor workspaces</text>
    <text x="391" y="396" text-anchor="middle">orders · proposals · audit log</text>
    <text x="391" y="414" text-anchor="middle">rules fallback if AI fails</text>
  </g>
  <g>
    <rect x="600" y="70" width="340" height="80" rx="12" fill="#e8effc" stroke="#0b57d0"/>
    <text x="770" y="98" text-anchor="middle" font-weight="700">PayPal Agent Toolkit</text>
    <text x="770" y="118" text-anchor="middle">read-only tools for Claude: invoices, disputes,</text>
    <text x="770" y="136" text-anchor="middle">orders, transactions, shipment tracking</text>
    <rect x="600" y="165" width="340" height="70" rx="12" fill="#e8effc" stroke="#0b57d0"/>
    <text x="770" y="193" text-anchor="middle" font-weight="700">PayPal Server SDK (APIMatic)</text>
    <text x="770" y="213" text-anchor="middle">Orders: create · capture (idempotent) · track; Payments</text>
    <rect x="600" y="250" width="340" height="80" rx="12" fill="#e8effc" stroke="#0b57d0"/>
    <text x="770" y="278" text-anchor="middle" font-weight="700">PayPal REST</text>
    <text x="770" y="298" text-anchor="middle">Disputes: evidence · accept · message · adjudicate*</text>
    <text x="770" y="316" text-anchor="middle">Invoicing: list · remind · create · Tracking batch</text>
    <rect x="600" y="345" width="340" height="70" rx="12" fill="#fff3e0" stroke="#a35200"/>
    <text x="770" y="373" text-anchor="middle" font-weight="700">Anthropic API (Claude)</text>
    <text x="770" y="393" text-anchor="middle">structured plans + tool-use loop</text>
    <rect x="600" y="425" width="340" height="60" rx="12" fill="#f5f6f8" stroke="#5b6472"/>
    <text x="770" y="451" text-anchor="middle" font-weight="700">PayPal webhooks</text>
    <text x="770" y="469" text-anchor="middle">signature verified, then the agent runs</text>
  </g>
  <text x="20" y="505" fill="#5b6472">* sandbox only. Everything runs on the PayPal sandbox.</text>
</svg>
