<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Store</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1f1a14; --mute:#6b6257; --line:#e8e1d6; --accent:#8a4b20; --good:#137333; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14110e; --card:#1d1915; --ink:#f0ebe4; --mute:#a99f92; --line:#332c25; --accent:#e0a370; --good:#6fd08c; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 Georgia,"Times New Roman",serif; background:var(--bg); color:var(--ink); }
  header { padding:22px 16px; text-align:center; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:26px; letter-spacing:.02em; }
  header p { margin:4px 0 0; color:var(--mute); font-family:system-ui,sans-serif; font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:24px 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; display:grid; gap:10px; }
  .art { height:120px; border-radius:10px; display:grid; place-items:center; font-size:44px; background:linear-gradient(135deg,#efe3d3,#d9c3a5); }
  @media (prefers-color-scheme: dark) { .art { background:linear-gradient(135deg,#3a2f24,#5a4632); } }
  .item h2 { margin:0; font-size:18px; } .price { font-family:system-ui,sans-serif; font-weight:700; }
  .note { max-width:980px; margin:0 auto; padding:0 16px 32px; color:var(--mute); font-family:system-ui,sans-serif; font-size:13px; }
  .note a { color:var(--accent); }
  .ok { color:var(--good); font-family:system-ui,sans-serif; font-size:14px; }
  .err { color:#b3261e; font-family:system-ui,sans-serif; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Clay &amp; Thread</h1>
  <p>A demo small-business store. Checkout runs on the real PayPal sandbox.</p>
</header>
<main id="items"></main>
<p class="note">Pay with your <b>sandbox buyer account</b> (developer.paypal.com, Testing Tools, Sandbox Accounts). After paying, open the <a href="/">SellerShield dashboard</a> and click <b>Run agent</b>: the paid order shows up needing tracking.</p>
<script>
const art = { wallet: '👛', candle: '🕯️', mugs: '☕' };
(async () => {
  const cfg = await fetch('/api/shop/config').then((r) => r.json());
  const box = document.getElementById('items');
  if (!cfg.clientId) { box.innerHTML = '<p class="err">Add PayPal sandbox keys to enable checkout.</p>'; return; }
  await new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.clientId)}&currency=USD&intent=capture&components=buttons`;
    s.onload = ok; s.onerror = () => bad(new Error('PayPal SDK failed to load'));
    document.head.appendChild(s);
  }).catch((e) => { box.innerHTML = `<p class="err">${e.message}</p>`; throw e; });

  for (const p of cfg.products) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="art" aria-hidden="true">${art[p.sku] || '📦'}</div><h2>${p.name}</h2><div class="price">$${p.price.toFixed(2)}</div><div class="btn"></div><div class="msg"></div>`;
    box.appendChild(el);
    const msg = el.querySelector('.msg');
    paypal.Buttons({
      style: { layout: 'horizontal', tagline: false, height: 40 },
      createOrder: async () => {
        const r = await fetch('/api/shop/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sku: p.sku }) });
        const j = await r.json(); if (!r.ok) throw new Error(j.error); return j.id;
      },
      onApprove: async (data) => {
        msg.textContent = 'Capturing payment...';
        const r = await fetch('/api/shop/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId: data.orderID, sku: p.sku }) });
        const j = await r.json();
        if (!r.ok) { msg.className = 'err'; msg.textContent = j.error; return; }
        msg.className = 'ok'; msg.textContent = `Paid $${j.amount.toFixed(2)}. Capture ${j.captureId} (${j.captureStatus}). Thank you!`;
      },
      onError: (e) => { msg.className = 'err'; msg.textContent = String(e.message || e); },
    }).render(el.querySelector('.btn'));
  }
})();
</script>
</body>
</html>
